spring.application.name=coursecraft-backend

# --- Datasource (Supabase Postgres). Override via env in every real environment. ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/coursecraft}
spring.datasource.username=${DATABASE_USER:coursecraft}
spring.datasource.password=${DATABASE_PASSWORD:coursecraft}

# Apply schema.sql on startup (idempotent CREATE ... IF NOT EXISTS).
spring.sql.init.mode=always

# --- Auth: verify Supabase-issued JWTs against the project JWKS. ---
# JWKS URL is https://<project-ref>.supabase.co/auth/v1/.well-known/jwks.json
# Issuer is    https://<project-ref>.supabase.co/auth/v1
coursecraft.auth.jwks-uri=${SUPABASE_JWKS_URI:}
coursecraft.auth.issuer=${SUPABASE_JWT_ISSUER:}
coursecraft.auth.algorithms=${SUPABASE_JWT_ALGORITHMS:RS256,ES256}

server.port=${PORT:8080}
