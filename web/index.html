<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CourseCraft</title>
<style>
  :root { --p:#5b4bd6; --bg:#faf8ff; --card:#fff; --line:#e6e1f5; --muted:#6b6680; --err:#c62828; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:#1c1830; }
  header { background:var(--p); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:12px; position:sticky; top:0; }
  header b { font-size:18px; } header .sp { flex:1; }
  header button { background:rgba(255,255,255,.18); color:#fff; border:0; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  h2 { margin:18px 0 8px; } h3 { margin:14px 0 6px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin:10px 0; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button { background:var(--p); color:#fff; border:0; border-radius:999px; padding:10px 16px; font-size:15px; cursor:pointer; }
  button.ghost { background:#fff; color:var(--p); border:1px solid var(--p); }
  button.link { background:none; color:var(--p); padding:4px 6px; }
  button:disabled { opacity:.5; cursor:default; }
  input, select { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font-size:15px; margin:6px 0; background:#fff; }
  label.opt { display:flex; align-items:center; gap:8px; margin:4px 0; }
  .muted { color:var(--muted); font-size:13px; }
  .err { color:var(--err); }
  .clickable { cursor:pointer; } .clickable:hover { border-color:var(--p); }
  .live { color:#c62828; font-weight:700; }
  .full { width:100%; } .grow { flex:1; }
  iframe, video { width:100%; aspect-ratio:16/9; border:0; border-radius:10px; background:#000; }
  .pill { font-size:12px; background:#efeaff; color:var(--p); border-radius:999px; padding:2px 8px; }
</style>
</head>
<body>
<header><b>CourseCraft</b><span class="sp"></span><span id="who" class="muted" style="color:#fff"></span><button id="signout" style="display:none">Sign out</button></header>
<main id="app">Loading…</main>

<script>
const SUPABASE = "https://qvpaeptwdplpflbxpwav.supabase.co";
const ANON = "sb_publishable_iZM8JIEF1H8iHtzTxu2FjA_2XlQeNJl";
const BACKEND = "https://coursecraft-backend-4izk.onrender.com";

const app = document.getElementById("app");
let TOKEN = localStorage.getItem("cc_token") || null;
let ME = null;

const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function supaAuth(email, password, signup) {
  const path = signup ? "/auth/v1/signup" : "/auth/v1/token?grant_type=password";
  const r = await fetch(SUPABASE + path, { method:"POST",
    headers:{ "apikey":ANON, "Content-Type":"application/json" },
    body: JSON.stringify({ email, password }) });
  const b = await r.json().catch(()=>({}));
  if (b.access_token) return b.access_token;
  throw new Error(b.msg || b.error_description || b.error || "Auth failed");
}

async function api(method, path, body) {
  const r = await fetch(BACKEND + path, { method,
    headers: Object.assign({ "Authorization":"Bearer "+TOKEN }, body?{"Content-Type":"application/json"}:{}),
    body: body? JSON.stringify(body): undefined });
  const text = await r.text();
  if (r.status === 401) { signOut(); throw new Error("Session expired — please sign in again."); }
  if (!r.ok) { let m; try { m = JSON.parse(text).message } catch(e){}; throw new Error(m || ("HTTP "+r.status)); }
  return text ? JSON.parse(text) : {};
}

function setToken(t) { TOKEN = t; if (t) localStorage.setItem("cc_token", t); else localStorage.removeItem("cc_token"); }
function signOut() { setToken(null); ME=null; document.getElementById("signout").style.display="none"; document.getElementById("who").textContent=""; renderAuth(); }
document.getElementById("signout").onclick = signOut;

// ---------- Auth ----------
function renderAuth() {
  app.innerHTML = `<div class="card"><h2>Sign in to learn and teach</h2>
    <input id="email" type="email" placeholder="Email">
    <input id="pw" type="password" placeholder="Password">
    <div class="row"><button id="in" class="grow">Sign in</button><button id="up" class="ghost grow">Create account</button></div>
    <p id="msg" class="err"></p></div>`;
  const go = async (signup) => {
    const email = val("email"), pw = val("pw"); const msg = document.getElementById("msg"); msg.textContent="";
    try { setToken(await supaAuth(email, pw, signup)); await boot(); }
    catch(e){ msg.textContent = e.message; }
  };
  document.getElementById("in").onclick = ()=>go(false);
  document.getElementById("up").onclick = ()=>go(true);
}
const val = id => document.getElementById(id).value.trim();

// ---------- Home ----------
async function renderHome() {
  app.innerHTML = "Loading…";
  ME = await api("GET","/api/me");
  document.getElementById("who").textContent = ME.displayName + " · " + ME.role;
  document.getElementById("signout").style.display = "inline-block";
  let live = []; try { live = await api("GET","/api/live/now"); } catch(e){}
  let liveHtml = live.length ? `<h3 class="live">🔴 Live now</h3>` +
    live.map(s=>`<div class="card row"><span class="grow">${esc(s.title)}</span><button onclick="playVideo('${s.videoId}','${esc(s.title)}')">Join</button></div>`).join("") : "";
  const creator = ME.role === "CREATOR";
  app.innerHTML = `<h2>Hi, ${esc(ME.displayName)}</h2><div class="muted">Role: ${ME.role}</div>
    ${liveHtml}
    <div class="card"><div class="row">
      <button onclick="renderCatalog()">Browse courses</button>
      <button onclick="renderList('/api/my/learning','My Learning', true)">My Learning</button>
      ${creator? `<button onclick="renderList('/api/courses/mine','My courses', false)">My courses</button>
                  <button class="ghost" onclick="renderCreate()">Create a course</button>`
               : `<button class="ghost" onclick="becomeCreator()">Become a creator</button>`}
    </div></div>`;
}
async function becomeCreator(){ await api("POST","/api/creators"); renderHome(); }

// ---------- Course lists ----------
async function renderCatalog(){ renderList("/api/catalog","Courses", true); }
async function renderList(path, title, learnerOpen) {
  app.innerHTML = "Loading…";
  const list = await api("GET", path);
  app.innerHTML = `<div class="row"><button class="link" onclick="renderHome()">← Home</button><h2 class="grow">${title}</h2></div>` +
    (list.length? list.map(c=>`<div class="card clickable" onclick="${learnerOpen?`renderCourse('${c.id}','${esc(c.title)}')`:`renderManage('${c.id}','${esc(c.title)}')`}">
        <b>${esc(c.title)}</b><div class="muted">${[c.subject,c.level,c.status].filter(Boolean).join(" · ")}</div></div>`).join("")
     : `<p class="muted">Nothing here yet.</p>`);
}

// ---------- Learner course detail ----------
async function renderCourse(courseId, title) {
  app.innerHTML = "Loading…";
  const d = await api("GET", `/api/courses/${courseId}`);
  let pct=null; try { pct = (await api("GET",`/api/courses/${courseId}/progress`)).percent; } catch(e){}
  const secs = d.sections.map(s=>`<h3>${esc(s.section? s.section.title : s.title)}</h3>` +
      (s.lectures||[]).map(l=>`<div class="card clickable" onclick="playVideo('${l.videoId||''}','${esc(l.title)}')">▶ ${esc(l.title)}</div>`).join("")).join("");
  app.innerHTML = `<div class="row"><button class="link" onclick="renderCatalog()">← Courses</button><h2 class="grow">${esc(title)}</h2></div>
    <div class="card"><div class="row">
      <button id="enrollBtn" onclick="toggleEnroll('${courseId}', ${d.enrolled})">${d.enrolled?"Enrolled ✓ — Unenroll":"Enroll"}</button>
      ${pct!=null?`<span class="pill">${pct}% complete</span>`:""}
      <button class="ghost" onclick="renderAssessments('${courseId}','${esc(title)}')">Assessments & leaderboards</button>
      <button class="ghost" onclick="renderCourseLive('${courseId}','${esc(title)}')">Live sessions</button>
    </div></div>${secs}`;
}
async function toggleEnroll(courseId, enrolled){
  await api(enrolled?"DELETE":"POST", `/api/courses/${courseId}/enroll`);
  const d = await api("GET", `/api/courses/${courseId}`); renderCourse(courseId, d.course.title);
}

// ---------- Video ----------
function playVideo(videoId, title) {
  const isUrl = /^https?:\/\//i.test(videoId);
  const yt = !isUrl;
  const media = yt
    ? `<iframe src="https://www.youtube.com/embed/${encodeURIComponent(videoId)}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`
    : `<video controls src="${esc(videoId)}"></video>`;
  app.innerHTML = `<div class="row"><button class="link" onclick="renderHome()">← Home</button><h2 class="grow">${esc(title)}</h2></div>
    <div class="card">${media}${videoId?`<div class="row" style="margin-top:8px"><a href="${yt?`https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}`:esc(videoId)}" target="_blank"><button class="ghost">Open in new tab ↗</button></a></div>`:`<p class="err">No video.</p>`}</div>`;
}

// ---------- Assessments ----------
async function renderAssessments(courseId, title){
  app.innerHTML = "Loading…";
  const list = await api("GET", `/api/courses/${courseId}/assessments`);
  app.innerHTML = `<div class="row"><button class="link" onclick="renderCourse('${courseId}','${esc(title)}')">← ${esc(title)}</button><h2 class="grow">Assessments</h2></div>` +
    (list.length? list.map(a=>`<div class="card"><b>${esc(a.title)}</b> <span class="muted">pass ${a.passMark}%</span>
      <div class="row" style="margin-top:8px"><button onclick="takeAssessment('${a.id}','${esc(a.title)}')">Take</button>
      <button class="ghost" onclick="leaderboard('${a.id}','${esc(a.title)}')">Leaderboard</button></div></div>`).join("")
     : `<p class="muted">No assessments yet.</p>`);
}
async function takeAssessment(id, title){
  app.innerHTML = "Loading…";
  const t = await api("GET", `/api/assessments/${id}/take`);
  const qs = t.questions.map((q,qi)=>{
    const single = q.type !== "MULTIPLE";
    const opts = q.options.map(o=>`<label class="opt"><input type="${single?'radio':'checkbox'}" name="q${qi}" value="${o.id}"> ${esc(o.text)}</label>`).join("");
    return `<div class="card"><b>${esc(q.text)}</b> <span class="muted">(${q.points} pts)</span>${opts}</div>`;
  }).join("");
  app.innerHTML = `<h2>${esc(title)}</h2>${qs}<button id="submit" class="full">Submit</button><p id="res"></p>`;
  document.getElementById("submit").onclick = async ()=>{
    const answers = t.questions.map((q,qi)=>({ questionId:q.id,
      optionIds: Array.from(document.querySelectorAll(`input[name=q${qi}]:checked`)).map(e=>e.value) }));
    const r = await api("POST", `/api/assessments/${id}/submit`, { answers });
    document.getElementById("res").innerHTML =
      `<div class="card"><h3>${r.passed?"Passed 🎉":"Not passed"}</h3>Score: ${r.score} / ${r.maxScore}
       <div><button class="ghost" onclick="leaderboard('${id}','${esc(title)}')">View leaderboard</button></div></div>`;
  };
}
async function leaderboard(id, title){
  app.innerHTML = "Loading…";
  const rows = await api("GET", `/api/assessments/${id}/leaderboard`);
  app.innerHTML = `<h2>${esc(title)} — leaderboard</h2>` +
    (rows.length? rows.map((e,i)=>`<div class="card row"><b class="grow">#${i+1} ${esc(e.displayName)}</b><span>${e.bestScore}/${e.maxScore}</span></div>`).join("")
     : `<p class="muted">No attempts yet.</p>`) + `<button class="ghost" onclick="renderHome()">Home</button>`;
}

// ---------- Live (per course) ----------
async function renderCourseLive(courseId, title){
  app.innerHTML = "Loading…";
  const list = await api("GET", `/api/courses/${courseId}/live`);
  const fmt = ms => new Date(ms).toLocaleString();
  app.innerHTML = `<div class="row"><button class="link" onclick="renderCourse('${courseId}','${esc(title)}')">← ${esc(title)}</button><h2 class="grow">Live sessions</h2></div>` +
    (list.length? list.map(s=>`<div class="card"><b>${esc(s.title)}</b> <span class="pill">${s.status}</span>
      <div class="muted">${s.status==='SCHEDULED'?'Starts '+fmt(s.startsAtEpochMs):''}</div>
      <div class="row" style="margin-top:6px">${s.status==='LIVE'?`<button onclick="playVideo('${s.videoId}','${esc(s.title)}')">Join</button>`
        : s.status==='ENDED'?`<button class="ghost" onclick="playVideo('${s.videoId}','${esc(s.title)}')">Watch recording</button>`:''}</div></div>`).join("")
     : `<p class="muted">No live sessions scheduled.</p>`);
}

// ---------- Creator: create + manage ----------
function renderCreate(){
  app.innerHTML = `<div class="row"><button class="link" onclick="renderHome()">← Home</button><h2 class="grow">Create a course</h2></div>
    <div class="card"><input id="t" placeholder="Title"><input id="su" placeholder="Subject (optional)"><input id="lv" placeholder="Level (optional)">
    <button id="c" class="full">Create</button><p id="m" class="err"></p></div>`;
  document.getElementById("c").onclick = async ()=>{
    try { const c = await api("POST","/api/courses",{ title:val("t"), subject:val("su"), level:val("lv") });
      renderManage(c.id, c.title); } catch(e){ document.getElementById("m").textContent=e.message; }
  };
}
async function renderManage(courseId, title){
  app.innerHTML = "Loading…";
  const d = await api("GET", `/api/courses/${courseId}`);
  const secs = d.sections.map(s=>{
    const sid = s.id;
    const lecs = (s.lectures||[]).map(l=>`<div class="muted">• ${esc(l.title)}</div>`).join("");
    return `<div class="card"><b>${esc(s.title)}</b>${lecs}
      <input id="lt_${sid}" placeholder="Lecture title"><input id="lv_${sid}" placeholder="YouTube id/URL or MP4/HLS link">
      <button class="ghost" onclick="addLecture('${courseId}','${sid}','${esc(title)}')">Add video lecture</button></div>`;
  }).join("");
  app.innerHTML = `<div class="row"><button class="link" onclick="renderList('/api/courses/mine','My courses', false)">← My courses</button><h2 class="grow">${esc(title)}</h2></div>
    <div class="card">Status: ${d.course.status}
      <div class="row" style="margin-top:8px">
        <button class="ghost" onclick="renderManageAssessments('${courseId}','${esc(title)}')">Assessments</button>
        <button class="ghost" onclick="renderManageLive('${courseId}','${esc(title)}')">Live sessions</button>
        <button class="ghost" onclick="analytics('${courseId}','${esc(title)}')">Analytics</button>
      </div></div>
    <div class="card"><input id="newsec" placeholder="New section title"><button onclick="addSection('${courseId}','${esc(title)}')">Add section</button></div>
    ${secs}
    <button class="full" onclick="publish('${courseId}','${esc(title)}')">Publish course</button><p id="mm" class="err"></p>`;
}
async function addSection(courseId,title){ const t=val("newsec"); if(!t)return; await api("POST",`/api/courses/${courseId}/sections`,{title:t}); renderManage(courseId,title); }
async function addLecture(courseId, sectionId, title){
  const lt = val("lt_"+sectionId), lv = val("lv_"+sectionId); if(!lt||!lv) return;
  const isUrl = /^https?:\/\//i.test(lv); const yt = /youtube\.com|youtu\.be/i.test(lv);
  const provider = (isUrl && !yt) ? "mp4" : "youtube";
  await api("POST", `/api/courses/${courseId}/sections/${sectionId}/lectures`, { title:lt, videoProvider:provider, videoId:lv });
  renderManage(courseId, title);
}
async function publish(courseId,title){ try{ await api("POST",`/api/courses/${courseId}/publish`); renderManage(courseId,title);}catch(e){ document.getElementById("mm").textContent=e.message; } }

async function renderManageAssessments(courseId, title){
  app.innerHTML="Loading…";
  const list = await api("GET",`/api/courses/${courseId}/assessments`);
  app.innerHTML = `<div class="row"><button class="link" onclick="renderManage('${courseId}','${esc(title)}')">← ${esc(title)}</button><h2 class="grow">Assessments</h2></div>
    <div class="card"><input id="at" placeholder="Assessment title"><input id="pm" type="number" value="60" placeholder="Pass mark %">
    <button onclick="createAssessment('${courseId}','${esc(title)}')">Create assessment</button></div>` +
    list.map(a=>`<div class="card"><b>${esc(a.title)}</b> <span class="muted">pass ${a.passMark}%</span>
      <button class="ghost" onclick="addQuestionForm('${a.id}','${esc(a.title)}')">Add question</button></div>`).join("");
}
async function createAssessment(courseId,title){ const t=val("at"),pm=parseInt(val("pm")||"60"); if(!t)return;
  await api("POST",`/api/courses/${courseId}/assessments`,{title:t,passMark:pm}); renderManageAssessments(courseId,title); }
function addQuestionForm(assessmentId, atitle){
  app.innerHTML = `<h2>Add question</h2><div class="card">
    <input id="qt" placeholder="Question text">
    <select id="qtype"><option value="SINGLE">Single choice</option><option value="MULTIPLE">Multiple</option><option value="TRUE_FALSE">True/False</option></select>
    <input id="qp" type="number" value="10" placeholder="Points">
    ${[0,1,2,3].map(i=>`<div class="row"><input class="grow" id="o${i}" placeholder="Option ${i+1}"><label class="opt"><input type="checkbox" id="c${i}"> correct</label></div>`).join("")}
    <button id="addq">Add question</button> <button class="ghost" id="doneq">Done</button><p id="qm" class="err"></p></div>`;
  document.getElementById("addq").onclick = async ()=>{
    const options=[0,1,2,3].map(i=>({text:document.getElementById("o"+i).value.trim(), correct:document.getElementById("c"+i).checked})).filter(o=>o.text);
    try { await api("POST",`/api/assessments/${assessmentId}/questions`,{ text:val("qt"), type:document.getElementById("qtype").value, points:parseInt(val("qp")||"10"), options });
      addQuestionForm(assessmentId, atitle); } catch(e){ document.getElementById("qm").textContent=e.message; }
  };
  document.getElementById("doneq").onclick = ()=>renderHome();
}
async function analytics(courseId,title){
  app.innerHTML="Loading…";
  const a = await api("GET",`/api/courses/${courseId}/analytics`);
  app.innerHTML = `<h2>${esc(title)} — analytics</h2><div class="card">Enrollments: <b>${a.enrollments}</b></div>` +
    (a.assessments.length? a.assessments.map(s=>`<div class="card"><b>${esc(s.title)}</b><div>Attempts: ${s.attempts} · Avg: ${s.averagePercent}%</div></div>`).join("") : `<p class="muted">No assessments.</p>`)
    + `<button class="ghost" onclick="renderManage('${courseId}','${esc(title)}')">Back</button>`;
}

// ---------- Creator: live ----------
async function renderManageLive(courseId, title){
  app.innerHTML="Loading…";
  const list = await api("GET",`/api/courses/${courseId}/live`);
  const fmt = ms => new Date(ms).toLocaleString();
  app.innerHTML = `<div class="row"><button class="link" onclick="renderManage('${courseId}','${esc(title)}')">← ${esc(title)}</button><h2 class="grow">Live sessions</h2></div>
    <div class="card"><input id="lst" placeholder="Session title"><input id="lsv" placeholder="YouTube (Live) id or URL">
      <input id="lsw" type="datetime-local"><button onclick="scheduleLive('${courseId}','${esc(title)}')">Schedule</button></div>` +
    list.map(s=>`<div class="card"><b>${esc(s.title)}</b> <span class="pill">${s.status}</span>
      <div class="muted">${s.status==='SCHEDULED'?'Starts '+fmt(s.startsAtEpochMs):''}</div>
      <div class="row" style="margin-top:6px">
        ${s.status==='SCHEDULED'?`<button onclick="liveAction('${courseId}','${esc(title)}','${s.id}','start')">Go live</button>
          <button class="ghost" onclick="liveAction('${courseId}','${esc(title)}','${s.id}','cancel')">Cancel</button>`:''}
        ${s.status==='LIVE'?`<button onclick="liveAction('${courseId}','${esc(title)}','${s.id}','end')">End</button>
          <button class="ghost" onclick="playVideo('${s.videoId}','${esc(s.title)}')">Preview</button>`:''}
        ${s.status==='ENDED'?`<button class="ghost" onclick="playVideo('${s.videoId}','${esc(s.title)}')">Watch</button>`:''}
      </div></div>`).join("");
}
async function scheduleLive(courseId,title){
  const t=val("lst"),v=val("lsv"),w=document.getElementById("lsw").value;
  if(!t||!v)return; const ms = w? new Date(w).getTime() : Date.now();
  await api("POST",`/api/courses/${courseId}/live`,{ title:t, youtubeVideoId:v, startsAtEpochMs:ms }); renderManageLive(courseId,title);
}
async function liveAction(courseId,title,id,action){ await api("POST",`/api/live/${id}/${action}`); renderManageLive(courseId,title); }

// ---------- boot ----------
async function boot(){
  if (!TOKEN) { renderAuth(); return; }
  try { await renderHome(); } catch(e){ if(String(e.message).includes("Session")) return; app.innerHTML = `<p class="err">${esc(e.message)}</p><button onclick="signOut()">Sign in</button>`; }
}
window.addEventListener("popstate", ()=>{}); // history.back() falls through to re-render via buttons
boot();
</script>
</body>
</html>
