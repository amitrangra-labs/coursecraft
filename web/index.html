<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CourseCraft</title>
<style>
  :root { --p:#5b4bd6; --bg:#faf8ff; --card:#fff; --line:#e6e1f5; --muted:#6b6680; --err:#c62828; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:#1c1830; }
  header { background:var(--p); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:5; }
  header b { font-size:18px; } header .sp { flex:1; }
  header button { background:rgba(255,255,255,.18); color:#fff; border:0; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  h2 { margin:14px 0 8px; } h3 { margin:14px 0 6px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin:10px 0; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button { background:var(--p); color:#fff; border:0; border-radius:999px; padding:10px 16px; font-size:15px; cursor:pointer; }
  button.ghost { background:#fff; color:var(--p); border:1px solid var(--p); }
  button.link { background:none; color:var(--p); padding:4px 8px; border-radius:8px; }
  button.link:hover { background:#efeaff; }
  button:disabled { opacity:.5; cursor:default; }
  input, select { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font-size:15px; margin:6px 0; background:#fff; }
  label.opt { display:flex; align-items:center; gap:8px; margin:4px 0; }
  .muted { color:var(--muted); font-size:13px; }
  .err { color:var(--err); }
  .clickable { cursor:pointer; } .clickable:hover { border-color:var(--p); }
  .live { color:#c62828; font-weight:700; }
  .grow { flex:1; }
  .crumbs { display:flex; gap:6px; align-items:center; margin-bottom:6px; }
  iframe, video { width:100%; aspect-ratio:16/9; border:0; border-radius:10px; background:#000; }
  .pill { font-size:12px; background:#efeaff; color:var(--p); border-radius:999px; padding:2px 8px; }
</style>
</head>
<body>
<header><b>CourseCraft</b><span class="sp"></span><span id="who" class="muted" style="color:#fff"></span><button id="signout" style="display:none">Sign out</button></header>
<main id="app">Loading…</main>

<script>
const SUPABASE = "https://qvpaeptwdplpflbxpwav.supabase.co";
const ANON = "sb_publishable_iZM8JIEF1H8iHtzTxu2FjA_2XlQeNJl";
const BACKEND = "https://coursecraft-backend-4izk.onrender.com";

const app = document.getElementById("app");
let TOKEN = localStorage.getItem("cc_token") || null;
let ME = null;
let currentState = { v:"home" };

const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- history router ----------
function render(s){
  currentState = s;
  switch (s.v) {
    case "home": return renderHome();
    case "list": return renderList(s.path, s.title, s.open);
    case "course": return renderCourse(s.id, s.title);
    case "assessments": return renderAssessments(s.id, s.title);
    case "take": return takeAssessment(s.id, s.title);
    case "leaderboard": return leaderboard(s.id, s.title);
    case "courselive": return renderCourseLive(s.id, s.title);
    case "create": return renderCreate();
    case "manage": return renderManage(s.id, s.title);
    case "manageAssess": return renderManageAssessments(s.id, s.title);
    case "addq": return addQuestionForm(s.id, s.title);
    case "analytics": return analytics(s.id, s.title);
    case "managelive": return renderManageLive(s.id, s.title);
    case "video": return playVideo(s.vid, s.title);
    default: return renderHome();
  }
}
function go(s){ history.pushState(s, ""); render(s); }
function back(){ history.back(); }
function home(){ go({ v:"home" }); }
function refresh(){ render(currentState); }
window.onpopstate = e => { if (!TOKEN) { renderAuth(); return; } render(e.state || { v:"home" }); };

// top bar with Back (previous screen) + Home, then the page title
const topbar = t => `<div class="crumbs">
  <button class="link" onclick="back()">← Back</button>
  <button class="link" onclick="home()">⌂ Home</button>
  <h2 class="grow" style="margin:0">${esc(t)}</h2></div>`;

// clicks on anything with data-go navigate (avoids quoting issues in titles)
app.addEventListener("click", e => {
  const el = e.target.closest("[data-go]"); if (!el) return;
  const d = el.dataset, s = { v: d.go };
  if (d.id != null) s.id = d.id;
  if (d.title != null) s.title = d.title;
  if (d.path) s.path = d.path;
  if (d.open != null) s.open = d.open === "1";
  if (d.vid != null) s.vid = d.vid;
  go(s);
});

// ---------- auth ----------
async function supaAuth(email, password, signup) {
  const path = signup ? "/auth/v1/signup" : "/auth/v1/token?grant_type=password";
  const r = await fetch(SUPABASE + path, { method:"POST",
    headers:{ "apikey":ANON, "Content-Type":"application/json" }, body: JSON.stringify({ email, password }) });
  const b = await r.json().catch(()=>({}));
  if (b.access_token) return b.access_token;
  throw new Error(b.msg || b.error_description || b.error || "Auth failed");
}
async function api(method, path, body) {
  const r = await fetch(BACKEND + path, { method,
    headers: Object.assign({ "Authorization":"Bearer "+TOKEN }, body?{"Content-Type":"application/json"}:{}),
    body: body? JSON.stringify(body): undefined });
  const text = await r.text();
  if (r.status === 401) { signOut(); throw new Error("Session expired — please sign in again."); }
  if (!r.ok) { let m; try { m = JSON.parse(text).message } catch(e){}; throw new Error(m || ("HTTP "+r.status)); }
  return text ? JSON.parse(text) : {};
}
function setToken(t){ TOKEN=t; if(t) localStorage.setItem("cc_token",t); else localStorage.removeItem("cc_token"); }
function signOut(){ setToken(null); ME=null; document.getElementById("signout").style.display="none"; document.getElementById("who").textContent=""; renderAuth(); }
document.getElementById("signout").onclick = signOut;
const val = id => document.getElementById(id).value.trim();

function renderAuth(){
  app.innerHTML = `<div class="card"><h2>Sign in to learn and teach</h2>
    <input id="email" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password">
    <div class="row"><button id="in" class="grow">Sign in</button><button id="up" class="ghost grow">Create account</button></div>
    <p id="msg" class="err"></p></div>`;
  const goAuth = async signup => { const msg=document.getElementById("msg"); msg.textContent="";
    try { setToken(await supaAuth(val("email"), val("pw"), signup)); history.replaceState({v:"home"},""); await renderHome();
      document.getElementById("signout").style.display="inline-block"; } catch(e){ msg.textContent=e.message; } };
  document.getElementById("in").onclick = ()=>goAuth(false);
  document.getElementById("up").onclick = ()=>goAuth(true);
}

// ---------- home ----------
async function renderHome(){
  app.innerHTML = "Loading…";
  ME = await api("GET","/api/me");
  document.getElementById("who").textContent = ME.displayName + " · " + ME.role;
  document.getElementById("signout").style.display = "inline-block";
  let live = []; try { live = await api("GET","/api/live/now"); } catch(e){}
  const liveHtml = live.length ? `<h3 class="live">🔴 Live now</h3>` +
    live.map(s=>`<div class="card row"><span class="grow">${esc(s.title)}</span>
      <button data-go="video" data-vid="${esc(s.videoId)}" data-title="${esc(s.title)}">Join</button></div>`).join("") : "";
  const creator = ME.role === "CREATOR";
  app.innerHTML = `<h2>Hi, ${esc(ME.displayName)}</h2><div class="muted">Role: ${ME.role}</div>${liveHtml}
    <div class="card"><div class="row">
      <button data-go="list" data-path="/api/catalog" data-title="Courses" data-open="1">Browse courses</button>
      <button data-go="list" data-path="/api/my/learning" data-title="My Learning" data-open="1">My Learning</button>
      ${creator? `<button data-go="list" data-path="/api/courses/mine" data-title="My courses" data-open="0">My courses</button>
                  <button class="ghost" data-go="create">Create a course</button>`
               : `<button class="ghost" id="bc">Become a creator</button>`}
    </div></div>`;
  if (!creator) document.getElementById("bc").onclick = becomeCreator;
}
async function becomeCreator(){ await api("POST","/api/creators"); refresh(); }

// ---------- lists ----------
async function renderList(path, title, open){
  app.innerHTML = topbar(title) + "<p class='muted'>Loading…</p>";
  const list = await api("GET", path);
  app.innerHTML = topbar(title) + (list.length? list.map(c=>`
    <div class="card clickable" data-go="${open?'course':'manage'}" data-id="${c.id}" data-title="${esc(c.title)}">
      <b>${esc(c.title)}</b><div class="muted">${[c.subject,c.level,c.status].filter(Boolean).join(" · ")}</div></div>`).join("")
    : `<p class="muted">Nothing here yet.</p>`);
}

// ---------- learner course ----------
async function renderCourse(courseId, title){
  app.innerHTML = topbar(title) + "<p class='muted'>Loading…</p>";
  const d = await api("GET", `/api/courses/${courseId}`);
  let pct=null; try { pct=(await api("GET",`/api/courses/${courseId}/progress`)).percent; } catch(e){}
  const secs = d.sections.map(s=>`<h3>${esc(s.title)}</h3>` +
      (s.lectures||[]).map(l=>`<div class="card clickable" data-go="video" data-vid="${esc(l.videoId||'')}" data-title="${esc(l.title)}">▶ ${esc(l.title)}</div>`).join("")).join("");
  app.innerHTML = topbar(title) + `<div class="card"><div class="row">
      <button id="enrollBtn">${d.enrolled?"Enrolled ✓ — Unenroll":"Enroll"}</button>
      ${pct!=null?`<span class="pill">${pct}% complete</span>`:""}
      <button class="ghost" data-go="assessments" data-id="${courseId}" data-title="${esc(title)}">Assessments & leaderboards</button>
      <button class="ghost" data-go="courselive" data-id="${courseId}" data-title="${esc(title)}">Live sessions</button>
    </div></div>` + secs;
  document.getElementById("enrollBtn").onclick = ()=>toggleEnroll(courseId, d.enrolled);
}
async function toggleEnroll(courseId, enrolled){ await api(enrolled?"DELETE":"POST", `/api/courses/${courseId}/enroll`); refresh(); }

// ---------- video ----------
function playVideo(videoId, title){
  const isUrl = /^https?:\/\//i.test(videoId), yt = !isUrl;
  const isHls = isUrl && /\.m3u8(\?|$)/i.test(videoId);
  const media = !videoId ? `<p class="err">No video.</p>`
    : yt ? `<iframe src="https://www.youtube.com/embed/${encodeURIComponent(videoId)}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`
         : `<video id="ccvid" controls playsinline ${isHls?'':`src="${esc(videoId)}"`}></video>`;
  const link = videoId ? `<div class="row" style="margin-top:8px"><a href="${yt?`https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}`:esc(videoId)}" target="_blank"><button class="ghost">Open in new tab ↗</button></a></div>` : "";
  app.innerHTML = topbar(title) + `<div class="card">${media}${link}</div>`;
  if (isHls) attachHls(document.getElementById("ccvid"), videoId);
}

// HLS (.m3u8) playback for self-hosted live/VOD. Safari plays it natively; other browsers get
// hls.js, loaded lazily from a CDN only when an HLS stream is actually opened (keeps the app
// dependency-free otherwise). ExoPlayer on Android handles HLS natively — this is web-only.
const _loaded = {};
function loadScript(src){
  return _loaded[src] || (_loaded[src] = new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  }));
}
async function attachHls(video, url){
  if (!video) return;
  if (video.canPlayType("application/vnd.apple.mpegurl")) { video.src = url; return; } // Safari/iOS
  try {
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js");
    if (window.Hls && window.Hls.isSupported()) {
      const hls = new window.Hls(); hls.loadSource(url); hls.attachMedia(video);
    } else { video.src = url; }
  } catch (e) { video.src = url; }
}

// ---------- assessments ----------
async function renderAssessments(courseId, title){
  app.innerHTML = topbar(title) + "<p class='muted'>Loading…</p>";
  const list = await api("GET", `/api/courses/${courseId}/assessments`);
  app.innerHTML = topbar(title) + (list.length? list.map(a=>`<div class="card"><b>${esc(a.title)}</b> <span class="muted">pass ${a.passMark}%</span>
      <div class="row" style="margin-top:8px"><button data-go="take" data-id="${a.id}" data-title="${esc(a.title)}">Take</button>
      <button class="ghost" data-go="leaderboard" data-id="${a.id}" data-title="${esc(a.title)}">Leaderboard</button></div></div>`).join("")
    : `<p class="muted">No assessments yet.</p>`);
}
async function takeAssessment(id, title){
  app.innerHTML = topbar(title) + "<p class='muted'>Loading…</p>";
  const t = await api("GET", `/api/assessments/${id}/take`);
  const qs = t.questions.map((q,qi)=>{ const single=q.type!=="MULTIPLE";
    const opts=q.options.map(o=>`<label class="opt"><input type="${single?'radio':'checkbox'}" name="q${qi}" value="${o.id}"> ${esc(o.text)}</label>`).join("");
    return `<div class="card"><b>${esc(q.text)}</b> <span class="muted">(${q.points} pts)</span>${opts}</div>`; }).join("");
  app.innerHTML = topbar(title) + qs + `<button id="submit" style="width:100%">Submit</button><p id="res"></p>`;
  document.getElementById("submit").onclick = async ()=>{
    const answers = t.questions.map((q,qi)=>({ questionId:q.id, optionIds: Array.from(document.querySelectorAll(`input[name=q${qi}]:checked`)).map(e=>e.value) }));
    const r = await api("POST", `/api/assessments/${id}/submit`, { answers });
    document.getElementById("res").innerHTML = `<div class="card"><h3>${r.passed?"Passed 🎉":"Not passed"}</h3>Score: ${r.score} / ${r.maxScore}
      <div><button class="ghost" data-go="leaderboard" data-id="${id}" data-title="${esc(title)}">View leaderboard</button></div></div>`;
  };
}
async function leaderboard(id, title){
  app.innerHTML = topbar(title+" — leaderboard") + "<p class='muted'>Loading…</p>";
  const rows = await api("GET", `/api/assessments/${id}/leaderboard`);
  app.innerHTML = topbar(title+" — leaderboard") + (rows.length? rows.map((e,i)=>`<div class="card row"><b class="grow">#${i+1} ${esc(e.displayName)}</b><span>${e.bestScore}/${e.maxScore}</span></div>`).join("")
    : `<p class="muted">No attempts yet.</p>`);
}

// ---------- live (learner) ----------
async function renderCourseLive(courseId, title){
  app.innerHTML = topbar(title+" — live") + "<p class='muted'>Loading…</p>";
  const list = await api("GET", `/api/courses/${courseId}/live`); const fmt = ms=>new Date(ms).toLocaleString();
  app.innerHTML = topbar(title+" — live") + (list.length? list.map(s=>`<div class="card"><b>${esc(s.title)}</b> <span class="pill">${s.status}</span>
      <div class="muted">${s.status==='SCHEDULED'?'Starts '+fmt(s.startsAtEpochMs):''}</div>
      <div class="row" style="margin-top:6px">${s.status==='LIVE'?`<button data-go="video" data-vid="${esc(s.videoId)}" data-title="${esc(s.title)}">Join</button>`
        : s.status==='ENDED'?`<button class="ghost" data-go="video" data-vid="${esc(s.videoId)}" data-title="${esc(s.title)}">Watch recording</button>`:''}</div></div>`).join("")
    : `<p class="muted">No live sessions scheduled.</p>`);
}

// ---------- creator: create + manage ----------
function renderCreate(){
  app.innerHTML = topbar("Create a course") + `<div class="card"><input id="t" placeholder="Title">
    <input id="su" placeholder="Subject (optional)"><input id="lv" placeholder="Level (optional)">
    <button id="c" style="width:100%">Create</button><p id="m" class="err"></p></div>`;
  document.getElementById("c").onclick = async ()=>{ try{ const c=await api("POST","/api/courses",{title:val("t"),subject:val("su"),level:val("lv")});
    go({v:"manage", id:c.id, title:c.title}); } catch(e){ document.getElementById("m").textContent=e.message; } };
}
async function renderManage(courseId, title){
  app.innerHTML = topbar(title) + "<p class='muted'>Loading…</p>";
  const d = await api("GET", `/api/courses/${courseId}`);
  const secs = d.sections.map(s=>{ const sid=s.id;
    const lecs=(s.lectures||[]).map(l=>`<div class="muted">• ${esc(l.title)}</div>`).join("");
    return `<div class="card"><b>${esc(s.title)}</b>${lecs}
      <input id="lt_${sid}" placeholder="Lecture title"><input id="lv_${sid}" placeholder="YouTube id/URL or MP4/HLS link">
      <button class="ghost" onclick="addLecture('${courseId}','${sid}')">Add video lecture</button></div>`; }).join("");
  app.innerHTML = topbar(title) + `<div class="card">Status: ${d.course.status}
      <div class="row" style="margin-top:8px">
        <button class="ghost" data-go="manageAssess" data-id="${courseId}" data-title="${esc(title)}">Assessments</button>
        <button class="ghost" data-go="managelive" data-id="${courseId}" data-title="${esc(title)}">Live sessions</button>
        <button class="ghost" data-go="analytics" data-id="${courseId}" data-title="${esc(title)}">Analytics</button>
      </div></div>
    <div class="card"><input id="newsec" placeholder="New section title"><button onclick="addSection('${courseId}')">Add section</button></div>
    ${secs}<button style="width:100%" onclick="publish('${courseId}')">Publish course</button><p id="mm" class="err"></p>`;
}
async function addSection(courseId){ const t=val("newsec"); if(!t)return; await api("POST",`/api/courses/${courseId}/sections`,{title:t}); refresh(); }
async function addLecture(courseId, sectionId){
  const lt=val("lt_"+sectionId), lv=val("lv_"+sectionId); if(!lt||!lv)return;
  const isUrl=/^https?:\/\//i.test(lv), ytLink=/youtube\.com|youtu\.be/i.test(lv);
  const provider=(isUrl && !ytLink)?"mp4":"youtube";
  await api("POST",`/api/courses/${courseId}/sections/${sectionId}/lectures`,{title:lt,videoProvider:provider,videoId:lv}); refresh();
}
async function publish(courseId){ try{ await api("POST",`/api/courses/${courseId}/publish`); refresh(); }catch(e){ document.getElementById("mm").textContent=e.message; } }

async function renderManageAssessments(courseId, title){
  app.innerHTML = topbar(title+" — assessments") + "<p class='muted'>Loading…</p>";
  const list = await api("GET",`/api/courses/${courseId}/assessments`);
  app.innerHTML = topbar(title+" — assessments") + `<div class="card"><input id="at" placeholder="Assessment title">
    <input id="pm" type="number" value="60" placeholder="Pass mark %"><button onclick="createAssessment('${courseId}')">Create assessment</button></div>` +
    list.map(a=>`<div class="card"><b>${esc(a.title)}</b> <span class="muted">pass ${a.passMark}%</span>
      <button class="ghost" data-go="addq" data-id="${a.id}" data-title="${esc(a.title)}">Add question</button></div>`).join("");
}
async function createAssessment(courseId){ const t=val("at"),pm=parseInt(val("pm")||"60"); if(!t)return;
  await api("POST",`/api/courses/${courseId}/assessments`,{title:t,passMark:pm}); refresh(); }
function addQuestionForm(assessmentId, atitle){
  app.innerHTML = topbar("Add question · "+atitle) + `<div class="card">
    <input id="qt" placeholder="Question text">
    <select id="qtype"><option value="SINGLE">Single choice</option><option value="MULTIPLE">Multiple</option><option value="TRUE_FALSE">True/False</option></select>
    <input id="qp" type="number" value="10" placeholder="Points">
    ${[0,1,2,3].map(i=>`<div class="row"><input class="grow" id="o${i}" placeholder="Option ${i+1}"><label class="opt"><input type="checkbox" id="c${i}"> correct</label></div>`).join("")}
    <button id="addq">Add question</button><p id="qm" class="err"></p></div>`;
  document.getElementById("addq").onclick = async ()=>{
    const options=[0,1,2,3].map(i=>({text:document.getElementById("o"+i).value.trim(),correct:document.getElementById("c"+i).checked})).filter(o=>o.text);
    try{ await api("POST",`/api/assessments/${assessmentId}/questions`,{text:val("qt"),type:document.getElementById("qtype").value,points:parseInt(val("qp")||"10"),options});
      refresh(); }catch(e){ document.getElementById("qm").textContent=e.message; }
  };
}
async function analytics(courseId, title){
  app.innerHTML = topbar(title+" — analytics") + "<p class='muted'>Loading…</p>";
  const a = await api("GET",`/api/courses/${courseId}/analytics`);
  app.innerHTML = topbar(title+" — analytics") + `<div class="card">Enrollments: <b>${a.enrollments}</b></div>` +
    (a.assessments.length? a.assessments.map(s=>`<div class="card"><b>${esc(s.title)}</b><div>Attempts: ${s.attempts} · Avg: ${s.averagePercent}%</div></div>`).join("") : `<p class="muted">No assessments.</p>`);
}

// ---------- creator: live ----------
async function renderManageLive(courseId, title){
  app.innerHTML = topbar(title+" — live") + "<p class='muted'>Loading…</p>";
  const list = await api("GET",`/api/courses/${courseId}/live`); const fmt = ms=>new Date(ms).toLocaleString();
  app.innerHTML = topbar(title+" — live") + `<div class="card"><input id="lst" placeholder="Session title">
      <input id="lsv" placeholder="YouTube (Live) id/URL or stream URL (.m3u8 / .mp4)">
      <div class="muted">Paste a YouTube Live link, or your own HLS stream URL (e.g. Owncast) to self-host.</div>
      <input id="lsw" type="datetime-local">
      <button onclick="scheduleLive('${courseId}')">Schedule</button></div>` +
    list.map(s=>`<div class="card"><b>${esc(s.title)}</b> <span class="pill">${s.status}</span>
      <div class="muted">${s.status==='SCHEDULED'?'Starts '+fmt(s.startsAtEpochMs):''}</div>
      <div class="row" style="margin-top:6px">
        ${s.status==='SCHEDULED'?`<button onclick="liveAction('${s.id}','start')">Go live</button><button class="ghost" onclick="liveAction('${s.id}','cancel')">Cancel</button>`:''}
        ${s.status==='LIVE'?`<button onclick="liveAction('${s.id}','end')">End</button><button class="ghost" data-go="video" data-vid="${esc(s.videoId)}" data-title="${esc(s.title)}">Preview</button>`:''}
        ${s.status==='ENDED'?`<button class="ghost" data-go="video" data-vid="${esc(s.videoId)}" data-title="${esc(s.title)}">Watch</button>`:''}
      </div></div>`).join("");
}
async function scheduleLive(courseId){ const t=val("lst"),v=val("lsv"),w=document.getElementById("lsw").value;
  if(!t||!v)return; const ms=w?new Date(w).getTime():Date.now();
  await api("POST",`/api/courses/${courseId}/live`,{title:t,videoRef:v,startsAtEpochMs:ms}); refresh(); }
async function liveAction(id, action){ await api("POST",`/api/live/${id}/${action}`); refresh(); }

// ---------- boot ----------
async function boot(){
  if (!TOKEN) { renderAuth(); return; }
  try { history.replaceState({v:"home"},""); await renderHome(); }
  catch(e){ if(String(e.message).includes("Session")) return; app.innerHTML = `<p class="err">${esc(e.message)}</p><button onclick="signOut()">Sign in</button>`; }
}
boot();
</script>
</body>
</html>
