name: android-release

# Build a signed, portable universal release APK and publish it as a GitHub Release.
# Triggered by pushing a version tag, e.g.:  git tag v0.1.0-mvp && git push origin v0.1.0-mvp
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret. Create a keystore and add the signing secrets — see android/README.md."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Assemble signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Stage APK + fingerprints
        id: stage
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          OUT="coursecraft-${GITHUB_REF_NAME}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          echo "Signing certificate:" > fingerprints.txt
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$OUT" | tee -a fingerprints.txt
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.stage.outputs.apk }}" \
            "${{ steps.stage.outputs.apk }}.sha256" \
            fingerprints.txt \
            --title "CourseCraft ${GITHUB_REF_NAME}" \
            --notes "Portable signed APK. Verify the SHA-256 in the attached .sha256 and the signing certificate in fingerprints.txt before installing. Enable 'Install unknown apps' or use: adb install ${{ steps.stage.outputs.apk }}"
